<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Purin Pi{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <h1 class="title">Purin Pi</h1>
    <nav class="nav">
      <a class="navlink" href="{{ url_for('dashboard.index') }}">Text</a>
      <a class="navlink" href="{{ url_for('dashboard.draw_page') }}">Draw</a>
      <a class="navlink" href="{{ url_for('dashboard.qr_page') }}">QR</a>
      <a class="navlink" href="{{ url_for('dashboard.notes_page') }}">Notes</a>
    </nav>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flashlist" aria-live="polite">
        {% for category, message in messages %}
          <li class="flash flash-{{ category }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
